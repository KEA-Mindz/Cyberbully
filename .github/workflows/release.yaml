name: release

on:
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/kea-cyberbully
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wrapper package
        run: |
          cd packages/kea-cyberbully
          python -m build

      - name: Verify wrapper distribution
        run: |
          twine check --strict packages/kea-cyberbully/dist/*

      - name: Publish wrapper to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/kea-cyberbully/dist/
